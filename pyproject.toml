[project]
name = "subject-wiki"
version = "0.1.0"
description = "Turn a subject's scattered resources into one searchable, cited knowledge base."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "python-pptx>=1.0",
    "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    # Third-party noise: PyMuPDF's SWIG bindings and Starlette's TestClient.
    "ignore::DeprecationWarning:importlib._bootstrap",
    "ignore:.*httpx2.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
